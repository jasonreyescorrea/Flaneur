<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flâneur</title>
<meta name="description" content="Independent coffee shops worth walking to, in Boston, Sacramento, New York, San Francisco and Mexico City.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Shrikhand&family=Covered+By+Your+Grace&display=swap">
<style>
/* Flâneur: off-white on one plain black page.
   Borrowed from the packaging-label way of working: one big contour-lined glyph, small mono type
   set like a fixtures table, a line of text running up the edge, and a single red-orange sticker.
   FONT: Scandium is a paid typeface; Space Grotesk (free, Google Fonts) stands in until a webfont license is confirmed. */
:root {
  --paper: #000000;
  --ink: #F2F2EE;
  --muted: #9A9A96;     /* 7:1 on black */
  --rule: #3A3A3A;
  --dot: #E85A3C;       /* the one sticker */
  --ease: cubic-bezier(.22, 1, .36, 1);
  --font-sans: "Scandium", "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --font-hand: "Covered By Your Grace", "Bradley Hand", cursive;
  --font-glyph: "Shrikhand", Georgia, serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--paper); }
body { margin: 0; min-height: 100vh; min-height: 100dvh; color: var(--ink); font-family: var(--font-sans); font-size: 13px; line-height: 1.35; -webkit-font-smoothing: antialiased;
  padding: max(clamp(20px, 6vh, 64px), env(safe-area-inset-top, 0px)) max(clamp(16px, 5vw, 80px), env(safe-area-inset-right, 0px)) clamp(32px, 6vh, 72px) max(clamp(16px, 5vw, 80px), env(safe-area-inset-left, 0px)); }
h1, h2, p { margin: 0; font-weight: inherit; font-size: inherit; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.sheet { max-width: 1080px; margin: 0 auto; }

/* head: the hand-lettered name and the cities */
.head { display: flex; flex-direction: column; align-items: center; gap: 18px; }
/* LOGO SLOT: replace .logo-word with the final hand-lettered logo (SVG) when it is ready */
.logo { line-height: .8; }
.logo-word { display: block; font-family: var(--font-hand); font-size: 30px; text-transform: uppercase; letter-spacing: .01em; transform: rotate(-3deg) scaleY(1.15); }
.nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 18px; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.nav a { color: var(--muted); transition: color .2s; }
.nav a:hover, .nav a[aria-current="page"] { color: var(--ink); }
#home-view:not([hidden]) ~ .x, body.is-home .nav { display: none; }

/* the line that runs up the edge of the page */
.edge { position: fixed; top: 50%; left: max(10px, env(safe-area-inset-left, 0px)); transform: translateY(-50%) rotate(180deg); writing-mode: vertical-rl;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); white-space: nowrap; pointer-events: none; }
.edge.r { left: auto; right: max(10px, env(safe-area-inset-right, 0px)); transform: translateY(-50%); }

/* home: the cities set like a fixtures table */
.table { list-style: none; margin: clamp(48px, 10vh, 112px) auto 0; padding: 0; max-width: 760px; font-family: var(--font-mono); font-size: 13px; }
.row { border-top: 1px solid var(--rule); }
.row:last-child { border-bottom: 1px solid var(--rule); }
.row a { display: grid; grid-template-columns: 4.5em 1.3fr 1.3fr 1fr; align-items: baseline; gap: 16px; padding: 14px 0; transition: color .2s; }
.row .code { color: var(--muted); }
.row .city { font-family: var(--font-sans); font-weight: 500; font-size: 20px; letter-spacing: -.01em; }
.row .cafe, .row .hood { color: var(--muted); }
.row .hood { text-align: right; }
.row a:hover .cafe, .row a:hover .hood, .row a:hover .code { color: var(--ink); }
.row a:hover .city { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }

/* city: one big glyph with contour lines, a sticker on its shoulder */
.stage { position: relative; display: grid; place-items: center; margin: clamp(28px, 6vh, 64px) auto 0; max-width: 760px; }
.glyph { display: block; width: auto; height: clamp(180px, 40vh, 380px); max-width: 100%; overflow: visible; }
.glyph text { font-family: var(--font-glyph); font-size: 300px; }
.sticker { position: absolute; top: 4%; right: 8%; width: clamp(54px, 8vw, 84px); aspect-ratio: 1; border-radius: 50%; background: var(--dot); color: #000;
  display: grid; place-items: center; font-family: var(--font-mono); font-weight: 500; font-size: clamp(10px, 1.2vw, 12px); letter-spacing: .04em; text-transform: uppercase; transform: rotate(-12deg); }

.city-name { text-align: center; margin-top: clamp(20px, 4vh, 36px); font-family: var(--font-hand); text-transform: uppercase; font-size: clamp(40px, 6vw, 72px); line-height: .9; transform: rotate(-2deg) scaleY(1.1); }
.city-name:focus { outline: none; }

.spec { margin: clamp(28px, 5vh, 48px) auto 0; max-width: 520px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
  display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: baseline; padding: 14px 0; font-family: var(--font-mono); font-size: 13px; position: relative; }
.spec h2 { font-family: var(--font-sans); font-weight: 600; font-size: 20px; letter-spacing: -.01em; }
.spec p { color: var(--muted); }
.spec a::after { content: ""; position: absolute; inset: 0; }
.spec:hover h2, .spec:has(a:focus-visible) h2 { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
.spec a:focus-visible { outline: none; }
.spec:has(a:focus-visible) { outline: 2px solid var(--ink); outline-offset: 4px; }

main:not([hidden]) { animation: view-in .5s var(--ease) both; }
@keyframes view-in { from { opacity: 0; } }
@media (prefers-reduced-motion: no-preference) {
  .glyph .ring { animation: ring-in .9s var(--ease) both; animation-delay: var(--d, 0ms); }
  @keyframes ring-in { from { opacity: 0; } }
  .sticker { animation: stick .6s var(--ease) .45s both; }
  @keyframes stick { from { opacity: 0; transform: rotate(-40deg) scale(.6); } }
}

@media (max-width: 640px) {
  .row a { grid-template-columns: 3.6em 1fr; row-gap: 2px; }
  .row .cafe { grid-column: 2; }
  .row .hood { grid-column: 2; text-align: left; }
  .row .city { font-size: 18px; }
  .edge { display: none; }
  .glyph { height: auto; width: 100%; max-height: 36vh; }
  .sticker { right: 2%; }
  .spec { grid-template-columns: 1fr; gap: 4px; text-align: center; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<p class="edge" id="edge-l" aria-hidden="true"></p>
<p class="edge r" id="edge-r" aria-hidden="true"></p>

<article class="sheet">
  <header class="head">
    <a class="logo" href="#home" aria-label="Flâneur, home"><span class="logo-word" aria-hidden="true">Flâneur</span></a>
    <nav class="nav" aria-label="Cities" id="tabs"></nav>
  </header>

  <main id="home-view" hidden>
    <h1 class="sr-only">Flâneur</h1>
    <ul class="table" id="table"></ul>
  </main>

  <main id="city-view" hidden>
    <div class="stage">
      <svg class="glyph" id="glyph" aria-hidden="true" viewBox="0 0 400 400"></svg>
      <span class="sticker" id="sticker" aria-hidden="true"></span>
    </div>
    <h1 class="city-name" id="city-title" tabindex="-1"></h1>
    <div class="spec" id="spec"></div>
  </main>
</article>

<script>
// Independent specialty shops rated 4.0+ on Yelp, Nov 2026.
// One café per city, kept on purpose. `mark` is the big glyph; `code` is the airport the walk starts from.
const CITIES = [
  { id: "boston", name: "Boston", mark: "B", code: "BOS", shop: { name: "Cicada Coffee Bar", hood: "Cambridge" } },
  { id: "sacramento", name: "Sacramento", mark: "S", code: "SMF", shop: { name: "Camellia Coffee", hood: "R Street" } },
  { id: "nyc", name: "New York", mark: "NY", code: "JFK", shop: { name: "Arcane Estate Coffee", hood: "West Village" } },
  { id: "sf", name: "San Francisco", mark: "SF", code: "SFO", shop: { name: "Golden Goat Coffee", hood: "SoMa" } },
  { id: "cdmx", name: "Ciudad de México", mark: "MX", code: "MEX", shop: { name: "El Minutito", hood: "Juárez" } }
];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const state = { city: null }; // null = home page
const mapsUrl = (s, c) => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(`${s.name} ${s.hood} ${c.name}`);
function pickView() { state.city = CITIES.find((c) => c.id === location.hash.slice(1)) || null; }

function renderNav() {
  $("tabs").innerHTML = CITIES.map((c) => `<a href="#${c.id}"${state.city === c ? ' aria-current="page"' : ""}>${esc(c.name)}</a>`).join("");
}

function renderHome() {
  $("table").innerHTML = CITIES.map((c) => `
    <li class="row"><a href="#${c.id}">
      <span class="code">${c.code}</span>
      <span class="city">${esc(c.name)}</span>
      <span class="cafe">${esc(c.shop.name)}</span>
      <span class="hood">${esc(c.shop.hood)}</span>
    </a></li>`).join("");
}

// The glyph: the same letters drawn several times, each a thinner stroke of alternating ink and paper,
// so the outline repeats outward like contour lines around a brush mark.
const RINGS = [96, 76, 56, 36, 16]; // stroke widths in glyph units (letters are 300 tall), outermost first
const H = 420;
function drawGlyph(mark) {
  const svg = $("glyph");
  const t = (attrs) => `<text x="0" y="${H / 2}" text-anchor="middle" dominant-baseline="central" ${attrs}>${esc(mark)}</text>`;
  svg.innerHTML = RINGS.map((w, i) =>
    `<g class="ring" style="--d:${(RINGS.length - i) * 70}ms">${t(`fill="none" stroke="var(${i % 2 ? "--paper" : "--ink"})" stroke-width="${w}" stroke-linejoin="round"`)}</g>`
  ).join("") + `<g class="ring">${t('fill="var(--ink)"')}</g>`;
  // the width depends on the letters, so measure once the font is in
  const fit = () => {
    const w = svg.querySelector("text").getComputedTextLength() + RINGS[0] + 40;
    svg.querySelectorAll("text").forEach((el) => el.setAttribute("x", w / 2));
    svg.setAttribute("viewBox", `0 0 ${w} ${H}`);
  };
  fit();
  document.fonts.load('300px "Shrikhand"', mark).then(fit, () => {});
}

function renderCity() {
  const c = state.city;
  drawGlyph(c.mark);
  $("sticker").textContent = c.code;
  $("city-title").textContent = c.name;
  $("spec").innerHTML = `
    <h2><a href="${mapsUrl(c.shop, c)}" target="_blank" rel="noopener">${esc(c.shop.name)}<span class="sr-only"> (opens Google Maps in a new tab)</span></a></h2>
    <p>${esc(c.shop.hood)}</p>`;
}

function renderAll() {
  const home = !state.city;
  $("home-view").hidden = !home;
  $("city-view").hidden = home;
  document.body.classList.toggle("is-home", home);
  document.title = home ? "Flâneur" : `${state.city.name} · Flâneur`;
  $("edge-l").textContent = home ? "Flâneur — coffee, on foot" : `Flâneur — ${state.city.name}`;
  $("edge-r").textContent = home ? "Five cities · One café each" : `${state.city.shop.name} — ${state.city.shop.hood}`;
  renderNav();
  if (home) renderHome(); else renderCity();
}

window.addEventListener("hashchange", () => {
  pickView(); renderAll(); window.scrollTo(0, 0);
  // no page load happened, so move focus to the new city's heading for keyboard and screen reader users
  if (state.city) $("city-title").focus({ preventScroll: true });
});

pickView();
renderAll();
</script>
</body>
</html>
