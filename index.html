<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flâneur</title>
<meta name="description" content="Independent coffee shops worth walking to, in Boston, Sacramento, New York, San Francisco and Mexico City.">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Space+Grotesk:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Covered+By+Your+Grace&display=swap">
<style>
/* Flâneur: black type on a white page, coloured from one palette ("Fiery Ocean"):
   oxblood, brick red, cream, navy, sky. The cities are set like a fixtures table.
   Type: Newsreader (serif, free, Google Fonts) for city names and the menu, in the spirit of a bakery's printed card;
   FONT: Scandium is a paid typeface; Space Grotesk (free, Google Fonts) stands in until a webfont license is confirmed. */
:root {
  --paper: #FFFFFF;
  --ink: #111111;
  --navy: #12304A;      /* secondary text, 13:1 on white */
  --red: #AE2A2A;       /* airport codes */
  --oxblood: #6E120D;   /* the page you're on */
  --cream: #FAEFD8;     /* row hover */
  --sky: #739BBB;       /* hairlines only */
  --ease: cubic-bezier(.22, 1, .36, 1);
  --font-serif: "Newsreader", "Tiempos Text", Georgia, serif;
  --font-sans: "Scandium", "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --font-hand: "Covered By Your Grace", "Bradley Hand", cursive;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { background: var(--paper); }
body { margin: 0; min-height: 100vh; min-height: 100dvh; color: var(--ink); font-family: var(--font-sans); font-size: 13px; line-height: 1.35; -webkit-font-smoothing: antialiased;
  padding: max(clamp(20px, 6vh, 64px), env(safe-area-inset-top, 0px)) max(clamp(16px, 5vw, 80px), env(safe-area-inset-right, 0px)) clamp(32px, 6vh, 72px) max(clamp(16px, 5vw, 80px), env(safe-area-inset-left, 0px)); }
h1, h2, p { margin: 0; font-weight: inherit; font-size: inherit; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--navy); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.sheet { max-width: 1080px; margin: 0 auto; }

/* head: the hand-lettered name and the cities */
.head { display: flex; flex-direction: column; align-items: center; gap: 20px; }
/* LOGO SLOT: replace .logo-word with the final hand-lettered logo (SVG) when it is ready */
.logo { line-height: .8; }
.logo-word { display: block; font-family: var(--font-hand); font-size: 30px; text-transform: uppercase; letter-spacing: .01em; transform: rotate(-3deg) scaleY(1.15); }
.nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 36px; font-family: var(--font-serif); font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; }
.nav a { color: var(--navy); transition: color .2s; }
.nav a:hover { color: var(--red); }
.nav a[aria-current="page"] { color: var(--oxblood); text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px; }
body.is-home .nav, body.is-home .edge { display: none; }

/* the line that runs up the edge of the page */
.edge { position: fixed; top: 50%; left: max(10px, env(safe-area-inset-left, 0px)); transform: translateY(-50%) rotate(180deg); writing-mode: vertical-rl;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--navy); white-space: nowrap; pointer-events: none; }
.edge.r { left: auto; right: max(10px, env(safe-area-inset-right, 0px)); transform: translateY(-50%); }

/* home: the cities set like a fixtures table */
.table { list-style: none; margin: clamp(48px, 10vh, 112px) auto 0; padding: 0; max-width: 780px; font-size: 14px; }
.row { border-top: 1px solid var(--sky); }
.row:last-child { border-bottom: 1px solid var(--sky); }
.row a { display: grid; grid-template-columns: 4.5em 1.3fr 1.3fr 1fr; align-items: baseline; gap: 16px; padding: 16px 12px; transition: background-color .25s, color .2s; }
.row .code { font-family: var(--font-mono); font-size: 12px; color: var(--red); }
.row .city { font-family: var(--font-serif); font-size: 26px; line-height: 1.05; letter-spacing: -.01em; }
.row .cafe, .row .hood { color: var(--navy); }
.row .hood { text-align: right; }
.row a:hover, .row a:focus-visible { background: var(--cream); }
.row a:hover .city { color: var(--oxblood); }


/* photographs, set side by side the way a bakery's front page sets its pictures: a wide one and a narrow one, same height */
.photos { display: grid; gap: var(--gap, 12px); margin: clamp(40px, 8vh, 80px) auto 0; max-width: 1080px; }
.photos.two { grid-template-columns: 2fr 1fr; }
.photos.one { max-width: 460px; }
.photos figure { margin: 0; overflow: hidden; background: var(--cream); }
.photos img { display: block; width: 100%; height: 100%; object-fit: cover; }
.photos.two figure { aspect-ratio: auto; height: clamp(260px, 46vw, 560px); }
.photos.one figure { aspect-ratio: 4 / 5; }
/* home: the photographs scattered across a 12-column field, each a different size and place, the table set in among them */
.scatter { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 16px; row-gap: clamp(40px, 9vh, 120px); margin-top: clamp(40px, 8vh, 88px); max-width: 1240px; margin-inline: auto; align-items: start; }
.shot { margin: 0; display: block; }
.shot img { display: block; width: 100%; height: auto; background: var(--cream); }
.shot figcaption { margin-top: 8px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--navy); }
.shot:hover figcaption { color: var(--oxblood); }
.s1 { grid-column: 1 / span 7; }
.s2 { grid-column: 10 / span 3; margin-top: 38%; }
.scatter .table { grid-column: 3 / span 8; margin: 0; max-width: none; width: 100%; }
.s3 { grid-column: 2 / span 4; }
.s4 { grid-column: 8 / span 4; margin-top: 30%; }
.s5 { grid-column: 4 / span 3; }
.s6 { grid-column: 8 / span 5; margin-top: 12%; }

/* city: the name in the serif, and the café as one row of the table */
.title { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: clamp(28px, 5vh, 48px); }
.city-name { font-family: var(--font-serif); font-size: clamp(32px, 4vw, 44px); line-height: 1.05; letter-spacing: -.01em; text-align: center; }
.city-name:focus { outline: none; }

.spec { margin: clamp(36px, 7vh, 64px) auto 0; max-width: 560px; border-top: 1px solid var(--sky); border-bottom: 1px solid var(--sky);
  display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: baseline; padding: 16px 12px; font-size: 14px; position: relative; transition: background-color .25s; }
.spec h2 { font-family: var(--font-sans); font-weight: 500; font-size: 20px; letter-spacing: -.01em; }
.spec p { color: var(--navy); }
.spec a::after { content: ""; position: absolute; inset: 0; }
.spec:hover, .spec:has(a:focus-visible) { background: var(--cream); }
.spec:hover h2 { color: var(--oxblood); }
.spec a:focus-visible { outline: none; }
.spec:has(a:focus-visible) { outline: 2px solid var(--navy); outline-offset: 4px; }

main:not([hidden]) { animation: view-in .5s var(--ease) both; }
@keyframes view-in { from { opacity: 0; } }
@media (prefers-reduced-motion: no-preference) {
}

@media (max-width: 640px) {
  .nav { gap: 6px 20px; }
  .row a { grid-template-columns: 3.6em 1fr; row-gap: 3px; padding-inline: 4px; }
  .row .cafe { grid-column: 2; }
  .row .hood { grid-column: 2; text-align: left; }
  .row .city { font-size: 22px; }
  .edge { display: none; }
  .title { flex-direction: column; gap: 14px; }
  .photos.two { grid-template-columns: 1fr; }
  .scatter { grid-template-columns: repeat(6, minmax(0, 1fr)); column-gap: 12px; row-gap: 48px; }
  .s1 { grid-column: 1 / -1; }
  .s2 { grid-column: 3 / -1; margin-top: 0; }
  .scatter .table { grid-column: 1 / -1; }
  .s3 { grid-column: 1 / span 4; }
  .s4 { grid-column: 3 / -1; margin-top: 0; }
  .s5 { grid-column: 1 / span 3; }
  .s6 { grid-column: 2 / -1; margin-top: 0; }
  .photos.two figure { height: auto; aspect-ratio: 4 / 3; }
  .photos.two figure + figure { display: none; }
  .spec { grid-template-columns: 1fr; gap: 4px; text-align: center; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<p class="edge" id="edge-l" aria-hidden="true"></p>
<p class="edge r" id="edge-r" aria-hidden="true"></p>

<article class="sheet">
  <header class="head">
    <a class="logo" href="#home" aria-label="Flâneur, home"><span class="logo-word" aria-hidden="true">Flâneur</span></a>
    <nav class="nav" aria-label="Cities" id="tabs"></nav>
  </header>

  <main id="home-view" hidden>
    <h1 class="sr-only">Flâneur</h1>
    <div class="scatter">
      <a class="shot s1" href="#nyc"><figure><img src="img/nyc-arcane.webp" alt="Inside Arcane Estate Coffee: dark wood panelling, globe lamps and red stools" width="1360" height="1020" fetchpriority="high"><figcaption>Arcane Estate Coffee, New York</figcaption></figure></a>
      <a class="shot s2" href="#sacramento"><figure><img src="img/sacramento-camellia.webp" alt="Camellia Coffee's brick front in late sun" width="1080" height="1080" loading="lazy"><figcaption>Camellia Coffee, Sacramento</figcaption></figure></a>
      <ul class="table" id="table"></ul>
      <a class="shot s3" href="#boston"><figure><img src="img/boston-charles.webp" alt="Boston from above: Back Bay rooftops and the Charles River" width="1080" height="1350" loading="lazy"><figcaption>The Charles, Boston</figcaption></figure></a>
      <a class="shot s4" href="#cdmx"><figure><img src="img/cdmx-minutito.webp" alt="El Minutito's narrow front under a red awning" width="425" height="470" loading="lazy"><figcaption>El Minutito, Ciudad de México</figcaption></figure></a>
      <a class="shot s5" href="#nyc"><figure><img src="img/nyc-street.webp" alt="An ivy-covered brick corner in the West Village" width="694" height="1200" loading="lazy"><figcaption>West Village, New York</figcaption></figure></a>
      <a class="shot s6" href="#sf"><figure><img src="img/sf-street.webp" alt="A steep San Francisco street of bay-window houses, the Transamerica Pyramid behind" width="1080" height="1350" loading="lazy"><figcaption>San Francisco</figcaption></figure></a>
    </div>
  </main>

  <main id="city-view" hidden>
    <div class="photos" id="photos"></div>
    <div class="title">
      <h1 class="city-name" id="city-title" tabindex="-1"></h1>
    </div>
    <div class="spec" id="spec"></div>
  </main>
</article>

<script>
// Independent specialty shops rated 4.0+ on Yelp, Nov 2026.
// One café per city, kept on purpose. `code` is the airport the walk starts from.
const CITIES = [
  { id: "boston", name: "Boston", code: "BOS", shop: { name: "Cicada Coffee Bar", hood: "Cambridge" },
    photos: [{ src: "boston-charles", w: 1080, h: 1350, alt: "Boston from above: Back Bay rooftops and the Charles River" }] },
  { id: "sacramento", name: "Sacramento", code: "SMF", shop: { name: "Camellia Coffee", hood: "R Street" },
    photos: [{ src: "sacramento-camellia", w: 1080, h: 1080, alt: "Camellia Coffee's brick front in late sun" }] },
  { id: "nyc", name: "New York", code: "JFK", shop: { name: "Arcane Estate Coffee", hood: "West Village" },
    photos: [{ src: "nyc-arcane", w: 1360, h: 1020, alt: "Inside Arcane Estate Coffee: dark wood, globe lamps, red stools" }, { src: "nyc-street", w: 694, h: 1200, alt: "An ivy-covered brick corner in the West Village" }] },
  { id: "sf", name: "San Francisco", code: "SFO", shop: { name: "Golden Goat Coffee", hood: "SoMa" },
    photos: [{ src: "sf-street", w: 1080, h: 1350, alt: "A steep San Francisco street of bay-window houses, the Transamerica Pyramid behind" }] },
  { id: "cdmx", name: "Ciudad de México", code: "MEX", shop: { name: "El Minutito", hood: "Juárez" },
    photos: [{ src: "cdmx-minutito", w: 425, h: 470, alt: "El Minutito's narrow front under a red awning" }] }
];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const state = { city: null }; // null = home page
const mapsUrl = (s, c) => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(`${s.name} ${s.hood} ${c.name}`);
function pickView() { state.city = CITIES.find((c) => c.id === location.hash.slice(1)) || null; }

function renderNav() {
  $("tabs").innerHTML = CITIES.map((c) => `<a href="#${c.id}"${state.city === c ? ' aria-current="page"' : ""}>${esc(c.name)}</a>`).join("");
}

function renderHome() {
  $("table").innerHTML = CITIES.map((c) => `
    <li class="row"><a href="#${c.id}">
      <span class="code">${c.code}</span>
      <span class="city">${esc(c.name)}</span>
      <span class="cafe">${esc(c.shop.name)}</span>
      <span class="hood">${esc(c.shop.hood)}</span>
    </a></li>`).join("");
}

function renderCity() {
  const c = state.city;
  const ph = $("photos");
  ph.className = "photos " + (c.photos.length > 1 ? "two" : "one");
  ph.innerHTML = c.photos.map((p) => `<figure><img src="img/${p.src}.webp" alt="${esc(p.alt)}" width="${p.w}" height="${p.h}"></figure>`).join("");
  $("city-title").textContent = c.name;
  $("spec").innerHTML = `
    <h2><a href="${mapsUrl(c.shop, c)}" target="_blank" rel="noopener">${esc(c.shop.name)}<span class="sr-only"> (opens Google Maps in a new tab)</span></a></h2>
    <p>${esc(c.shop.hood)}</p>`;
}

function renderAll() {
  const home = !state.city;
  $("home-view").hidden = !home;
  $("city-view").hidden = home;
  document.body.classList.toggle("is-home", home);
  document.title = home ? "Flâneur" : `${state.city.name} · Flâneur`;
  $("edge-l").textContent = home ? "Flâneur — coffee, on foot" : `Flâneur — ${state.city.name}`;
  $("edge-r").textContent = home ? "Five cities · One café each" : `${state.city.shop.name} — ${state.city.shop.hood}`;
  renderNav();
  if (home) renderHome(); else renderCity();
}

window.addEventListener("hashchange", () => {
  pickView(); renderAll(); window.scrollTo(0, 0);
  // no page load happened, so move focus to the new city's heading for keyboard and screen reader users
  if (state.city) $("city-title").focus({ preventScroll: true });
});

pickView();
renderAll();
</script>
</body>
</html>
